<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f4f6fb">
    <title>Regis-Bet</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=25">
</head>
<body>
<section id="login-screen" class="screen active">
    <div class="login-card">
        <div class="brand">Regis<span>-Bet</span></div>
        <p class="muted">Accès sécurisé</p>
        <input type="password" id="password-input" placeholder="Mot de passe" autocomplete="off"
               onkeydown="if(event.key==='Enter') checkPassword()">
        <button class="btn primary" onclick="checkPassword()">Entrer</button>
        <p id="error-msg" class="error-text"></p>
    </div>
</section>

<section id="main-screen" class="screen">
    <header class="topbar">
        <div class="brand small">Regis<span>-Bet</span></div>
        <div class="muted">Répartition</div>
    </header>
    <main class="container">

        <div class="card">
            <div class="card-title"><span class="step">1</span>Équipes et cotes du match</div>
            <label class="label">Équipe favorite (nom et cote)</label>
            <div class="grid-2" style="grid-template-columns:2fr 1fr;margin-bottom:12px">
                <input type="text" id="team-fav" placeholder="A">
                <input type="text" inputmode="decimal" id="cote-fav" placeholder="Cote">
            </div>
            <label class="label">Match nul (cote)</label>
            <div style="margin-bottom:12px"><input type="text" inputmode="decimal" id="cote-nul" placeholder="Cote"></div>
            <label class="label">Équipe faible (nom et cote)</label>
            <div class="grid-2" style="grid-template-columns:2fr 1fr">
                <input type="text" id="team-out" placeholder="B">
                <input type="text" inputmode="decimal" id="cote-out" placeholder="Cote">
            </div>
        </div>

        <div class="card">
            <div class="card-title"><span class="step">2</span>Mise</div>
            <div class="segmented">
                <button id="btn-mode-total" class="seg active" onclick="setMode('total')">Montant total</button>
                <button id="btn-mode-gain" class="seg" onclick="setMode('gain')">Gain cible</button>
            </div>
            <div id="input-total">
                <label class="label">Montant total à miser (FCFA)</label>
                <input type="text" inputmode="decimal" id="montant-total" value="1000">
            </div>
            <div id="input-gain" class="hidden">
                <div class="grid-2">
                    <div><label class="label">Gain min (FCFA)</label><input type="text" inputmode="decimal" id="gain-min" value="100"></div>
                    <div><label class="label">Gain max (FCFA)</label><input type="text" inputmode="decimal" id="gain-max" value="150"></div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-title"><span class="step">3</span>Variation anti-bot</div>
            <div class="chips" id="variation-chips">
                <button class="chip active" onclick="setVariation(0, this)">0%</button>
                <button class="chip" onclick="setVariation(0.01, this)">±1%</button>
                <button class="chip" onclick="setVariation(0.02, this)">±2%</button>
                <button class="chip" onclick="setVariation(0.03, this)">±3%</button>
                <button class="chip" onclick="setVariation(0.05, this)">±5%</button>
                <button class="chip" onclick="setVariation(0.07, this)">±7%</button>
                <button class="chip" onclick="setVariation(0.10, this)">±10%</button>
            </div>
        </div>

        <div id="resultats" class="hidden"></div>
    </main>
    <div class="bottom-bar"><button class="btn primary big" onclick="calculer()">Calculer</button></div>
</section>
<script src="script.js?v=25"></script>
</body>
</html>
