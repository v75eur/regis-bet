<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f4f6fb">
    <title>Regis-Bet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=14">
</head>
<body>

<section id="login-screen" class="screen active">
    <div class="login-card">
        <div class="brand">Regis<span>-Bet</span></div>
        <p class="muted">Accès sécurisé</p>
        <input type="password" id="password-input" placeholder="Mot de passe" autocomplete="off"
               onkeydown="if(event.key==='Enter') checkPassword()">
        <button class="btn primary" onclick="checkPassword()">Entrer</button>
        <p id="error-msg" class="error-text"></p>
    </div>
</section>

<section id="main-screen" class="screen">
    <header class="topbar">
        <div class="brand small">Regis<span>-Bet</span></div>
        <div class="muted">Répartition</div>
    </header>

    <main class="container">

        <div class="card">
            <div class="card-title"><span class="step">1</span>Équipes et codes</div>
            <div class="issues">
                <div class="issue">
                    <input type="text" id="team-fav" placeholder="Équipe favorite" style="flex:1">
                    <input type="text" inputmode="decimal" id="cote-fav" placeholder="Code">
                </div>
                <div class="issue">
                    <div class="issue-top">Match nul</div>
                    <input type="text" inputmode="decimal" id="cote-nul" placeholder="Code">
                </div>
                <div class="issue">
                    <input type="text" id="team-out" placeholder="Équipe faible" style="flex:1">
                    <input type="text" inputmode="decimal" id="cote-out" placeholder="Code">
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-title"><span class="step">2</span>Issues <small>(choisis-en 2)</small></div>
            <div class="issues">
                <div class="issue" id="issue-fn" onclick="toggleIssue('fn')">
                    <div class="issue-top"><span class="tick"></span><span id="lbl-fn">Favori ou nul</span></div>
                    <div class="issue-code" id="d-fn">-</div>
                </div>
                <div class="issue" id="issue-fo" onclick="toggleIssue('fo')">
                    <div class="issue-top"><span class="tick"></span><span id="lbl-fo">Favori ou faible</span></div>
                    <div class="issue-code" id="d-fo">-</div>
                </div>
                <div class="issue" id="issue-no" onclick="toggleIssue('no')">
                    <div class="issue-top"><span class="tick"></span><span id="lbl-no">Nul ou faible</span></div>
                    <div class="issue-code" id="d-no">-</div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-title"><span class="step">3</span>Mise</div>
            <div class="segmented">
                <button id="btn-mode-total" class="seg active" onclick="setMode('total')">Montant total</button>
                <button id="btn-mode-gain" class="seg" onclick="setMode('gain')">Gain cible</button>
            </div>
            <div id="input-total">
                <label class="label">Montant total à miser (FCFA)</label>
                <input type="text" inputmode="decimal" id="montant-total" value="1000">
            </div>
            <div id="input-gain" class="hidden">
                <div class="grid-2">
                    <div>
                        <label class="label">Gain min (FCFA)</label>
                        <input type="text" inputmode="decimal" id="gain-min" value="100">
                    </div>
                    <div>
                        <label class="label">Gain max (FCFA)</label>
                        <input type="text" inputmode="decimal" id="gain-max" value="150">
                    </div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-title"><span class="step">4</span>Variation anti-bot</div>
            <div class="chips" id="variation-chips">
                <button class="chip active" onclick="setVariation(0, this)">0%</button>
                <button class="chip" onclick="setVariation(0.01, this)">±1%</button>
                <button class="chip" onclick="setVariation(0.02, this)">±2%</button>
                <button class="chip" onclick="setVariation(0.03, this)">±3%</button>
                <button class="chip" onclick="setVariation(0.05, this)">±5%</button>
                <button class="chip" onclick="setVariation(0.07, this)">±7%</button>
                <button class="chip" onclick="setVariation(0.10, this)">±10%</button>
            </div>
        </div>

        <div id="resultats" class="hidden"></div>
    </main>

    <div class="bottom-bar">
        <button class="btn primary big" onclick="calculer()">Calculer</button>
    </div>
</section>

<script src="script.js?v=14"></script>
</body>
</html>
